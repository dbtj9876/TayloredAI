name: Deploy WordPress to GoDaddy via rsync

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deployment_dest:
        description: 'Target server directory'
        required: false
        default: 'public_html/wp-content/themes/TayloredAI-Theme/'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Validate Files Exist
        run: |
          echo "Checking required files..."
          ls -la
          echo ""
          echo "PHP files:"
          ls -la *.php || echo "No PHP files in root"

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 83w.9ff.myftpupload.com >> ~/.ssh/known_hosts 2>&1 || true
          echo "SSH key configured"

      - name: Create Remote Directory
        run: |
          DEST="${{ github.event.inputs.deployment_dest }}"
          if [ -z "$DEST" ]; then
            DEST="public_html/wp-content/themes/TayloredAI-Theme/"
          fi
          
          echo "Creating remote directory: $DEST"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no git_deployer_97f86e805a_695566@83w.9ff.myftpupload.com "mkdir -p ~/$DEST" 2>&1
          echo "Directory created"

      - name: Deploy Files via Rsync
        run: |
          DEST="${{ github.event.inputs.deployment_dest }}"
          if [ -z "$DEST" ]; then
            DEST="public_html/wp-content/themes/TayloredAI-Theme/"
          fi
          
          echo "Deploying to: $DEST"
          
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='*.md' \
            --exclude='*.zip' \
            ./ git_deployer_97f86e805a_695566@83w.9ff.myftpupload.com:~/$DEST 2>&1

      - name: Verify Deployment
        run: |
          DEST="${{ github.event.inputs.deployment_dest }}"
          if [ -z "$DEST" ]; then
            DEST="public_html/wp-content/themes/TayloredAI-Theme/"
          fi
          
          echo "Verifying files on server..."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no git_deployer_97f86e805a_695566@83w.9ff.myftpupload.com "ls -la ~/$DEST" 2>&1
