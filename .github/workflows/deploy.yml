name: Deploy WordPress to GoDaddy via rsync

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deployment_dest:
        description: 'Target server directory, leave blank for root directory'
        required: false
        default: ''

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.PRIVATE_KEY }}
          log-public-key: false

      - name: Add GoDaddy to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H 83w.9ff.myftpupload.com >> ~/.ssh/known_hosts

      - name: Deploy via rsync
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='README.md' \
            ./ git_deployer_924441bc33_695566@83w.9ff.myftpupload.com:/home/git_deployer_924441bc33_695566/public_html/wp-content/themes/tayloredai/
