name: Discover Server Structure

on:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 83w.9ff.myftpupload.com >> ~/.ssh/known_hosts 2>&1 || true

      - name: Find WordPress installation
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no git_deployer_97f86e805a_695566@83w.9ff.myftpupload.com "
            echo '=== tayloredai theme ROOT files ==='
            ls -la ~/public_html/wp-content/themes/tayloredai/
            echo '=== tayloredai theme_files/ ==='
            ls -la ~/public_html/wp-content/themes/tayloredai/theme_files/
            echo '=== cursor-default in tayloredai ROOT ==='
            grep -l 'cursor-default' ~/public_html/wp-content/themes/tayloredai/*.php 2>/dev/null || echo 'none in root'
            echo '=== TayloredAI-Theme ROOT files ==='
            ls -la ~/public_html/wp-content/themes/TayloredAI-Theme/
          " 2>&1
